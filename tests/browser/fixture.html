<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Příliš žluťoučká stránka</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { position: relative; display: flow-root; margin: 0; background: linear-gradient(#fafafa, #bbb); }
    header { position: fixed; top: 0; left: 0; width: 100%; height: 50px; background: rgb(220, 30, 30); z-index: 10; }
    h1 { margin: 60px 20px; }
    .middle { position: absolute; top: 4000px; left: 100px; width: 120px; height: 120px; background: rgb(20, 180, 40); }
    .tiny { position: absolute; top: 2040px; left: 20px; width: 400px; height: 64px; margin: 0; background: white; font: 9px/12px Arial, sans-serif; }
    #lazy { position: absolute; top: 7000px; left: 300px; width: 128px; height: 128px; }
    footer { position: absolute; bottom: 0; left: 0; width: 100%; height: 80px; background: rgb(20, 60, 210); }
  </style>
</head>
<body>
  <header>Fixed header</header>
  <h1>Full-page capture fixture</h1>
  <pre class="tiny">Příliš žluťoučký kůň. 0123456789 &lt;small&gt;
Nine-pixel text across the capture seam.</pre>
  <p hidden>HIDDEN TEXT MUST NOT LEAK</p>
  <div class="middle"></div>
  <img id="lazy" loading="lazy" src="/lazy.svg" alt="Lazy image">
  <img loading="lazy" src="/lazy.svg?hidden" alt="Hidden image" style="display:none">
  <footer>FINAL PIXEL</footer>
</body>
</html>
