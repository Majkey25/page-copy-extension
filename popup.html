<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Copy</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header"><h1>PAGE COPY</h1><span class="format">LOCAL EXPORT</span></header>
      <section class="actions" aria-label="Full-page screenshot">
        <div class="format-label"><label for="save-format">Export format</label><div id="info-wrap"><button id="info-button" type="button" aria-label="When to use this format" aria-controls="format-info" aria-describedby="format-info" aria-expanded="false">i</button><aside id="format-info" role="note" hidden><strong id="info-title"></strong><p id="info-use"></p><p id="info-detail"></p></aside></div></div>
        <select id="save-format" aria-describedby="format-help">
          <option value="png">PNG · original pixels</option>
        </select>
        <p id="format-help">Complete ZIP for archiving. Markdown or text for AI.</p>
        <button id="copy-button" class="button button-primary" type="button">COPY PNG</button>
        <button id="save-button" class="button button-secondary" type="button">SAVE AS…</button>
        <button id="text-button" class="button button-secondary" type="button">COPY TEXT FOR AI</button>
      </section>
      <footer><output id="status" role="status" aria-live="polite">Local exports. No uploads.</output></footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
