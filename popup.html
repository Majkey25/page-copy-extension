<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Copy</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header"><h1>PAGE COPY</h1><span class="format">PNG</span></header>
      <section class="actions" aria-label="Full-page screenshot">
        <button id="copy-button" class="button button-primary" type="button">COPY TO CLIPBOARD</button>
        <button id="save-button" class="button button-secondary" type="button">SAVE AS…</button>
      </section>
      <footer><output id="status" role="status" aria-live="polite">Entire page. One image.</output></footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
