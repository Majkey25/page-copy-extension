<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Copy</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header"><h1>PAGE COPY</h1><span class="format">LOSSLESS</span></header>
      <section class="actions" aria-label="Full-page screenshot">
        <button id="copy-button" class="button button-primary" type="button">COPY PNG</button>
        <button id="text-button" class="button button-secondary" type="button">COPY TEXT FOR AI</button>
        <label for="save-format">Save format</label>
        <select id="save-format" aria-describedby="format-help">
          <option value="png">PNG · original pixels</option>
          <option value="zip">AI tiles (ZIP) · PNGs + text</option>
          <option value="pdf">PDF · selectable page text</option>
          <option value="txt">TXT · page text</option>
        </select>
        <p id="format-help">For long pages, use AI tiles or text. Chats can shrink pasted images.</p>
        <button id="save-button" class="button button-secondary" type="button">SAVE AS…</button>
      </section>
      <footer><output id="status" role="status" aria-live="polite">Original pixels. No automatic shrinking.</output></footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
